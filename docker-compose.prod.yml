services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-app
    restart: unless-stopped
    environment:
      APP_NAME: "ERP AvanzaConoce"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "base64:nQFz6jiBELSzs4sJdYbnGz5Aq/MkYJSpcG/bTJPnmLs="
      APP_URL: "https://erp.servimercadeo.com"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: erp_avanzaconoce
      DB_USERNAME: erp_user
      DB_PASSWORD: erp_password_segura

      CACHE_DRIVER: file
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_LIFETIME: 120
      SESSION_SECURE_COOKIE: "false"
      QUEUE_CONNECTION: sync

      LOG_CHANNEL: stderr
      LOG_LEVEL: error
      RECAPTCHA_SECRET_KEY: "6Lc5wActAAAAAFw9UAuCpFjDRz_nlZrNTsAdux5Y"

      MAIL_MAILER: "${MAIL_MAILER}"
      MAIL_SCHEME: "${MAIL_SCHEME}"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME}"
      MAIL_AVAL_TO: "${MAIL_AVAL_TO}"
    volumes:
      - erp_storage:/var/www/html/storage/app
      - erp_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.erp.rule=Host(`erp.local`, `erp.servimercadeo.com`)"
      - "traefik.http.routers.erp.entrypoints=web"
      # Router del dominio público: certificado real de Let's Encrypt (resolver "letsencrypt"
      # configurado en el stack de Traefik en /srv/docker/traefik). Va separado del de
      # erp.local a propósito: un certificado ACME no puede emitirse para un host interno
      # no resoluble desde internet, así que no pueden compartir el mismo router/SAN.
      - "traefik.http.routers.erp-secure.rule=Host(`erp.servimercadeo.com`)"
      - "traefik.http.routers.erp-secure.entrypoints=websecure"
      - "traefik.http.routers.erp-secure.tls=true"
      - "traefik.http.routers.erp-secure.tls.certresolver=letsencrypt"
      # Router de erp.local: se mantiene con el certificado autofirmado por defecto de
      # Traefik, para seguir accediendo desde la LAN sin depender de internet.
      - "traefik.http.routers.erp-secure-local.rule=Host(`erp.local`)"
      - "traefik.http.routers.erp-secure-local.entrypoints=websecure"
      - "traefik.http.routers.erp-secure-local.tls=true"
      - "traefik.http.services.erp.loadbalancer.server.port=80"

  db:
    image: mysql:8.0
    container_name: erp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: erp_avanzaconoce
      MYSQL_USER: erp_user
      MYSQL_PASSWORD: erp_password_segura
      MYSQL_ROOT_PASSWORD: root_password_segura
    volumes:
      - erp_db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_segura"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  erp_db_data:
  erp_storage:
  erp_logs:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
